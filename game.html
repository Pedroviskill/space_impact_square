<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Impact</title>
<style>
body {
text-align: center;
background-color: black;
color: white;
font-family: Arial, sans-serif;
}
canvas {
background-color: black;
border: 2px solid white;
}
</style>
</head>
<body>
<h1>Space Impact</h1>
<canvas id="gameCanvas" width="800" height="400"></canvas>
<p>Use as teclas ↑ e ↓ para mover. Segure espaço para atirar.</p>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
// Configuração do jogo
let gameRunning = true;
let score = 0;
// Configuração da nave
const ship = {
x: 50,
y: canvas.height / 2 - 20,
width: 40,
height: 40,
speed: 5, // Aumentado de velocidade
bullets: []
};
// Configuração dos inimigos
let enemies = [];
function spawnEnemy() {
enemies.push({
x: canvas.width,
y: Math.random() * (canvas.height - 40),
width: 40,
height: 40,
speed: 3
});
}
// Controles da nave
let keys = {}; // Objeto para armazenar teclas pressionadas
document.addEventListener("keydown", (e) => keys[e.key] = true);
document.addEventListener("keyup", (e) => keys[e.key] = false);
function update() {
if (!gameRunning) return;
// Movimento da nave
if (keys["ArrowUp"] && ship.y > 0) ship.y -= ship.speed;
if (keys["ArrowDown"] && ship.y < canvas.height - ship.height) ship.y += ship.speed;
// Atirar continuamente enquanto espaço estiver pressionado
if (keys[" "] && ship.bullets.length < 15) {
ship.bullets.push({ x: ship.x + ship.width, y: ship.y + ship.height / 2, width: 10, height: 5, speed: 7 });
}
// Atualiza posição dos tiros
ship.bullets.forEach((bullet, index) => {
bullet.x += bullet.speed;
if (bullet.x > canvas.width) {
ship.bullets.splice(index, 1);
}
});
// Atualiza posição dos inimigos
enemies.forEach((enemy, index) => {
enemy.x -= enemy.speed;
if (enemy.x + enemy.width < 0) {
enemies.splice(index, 1);
}
// Checa colisão com a nave
if (enemy.x < ship.x + ship.width &&
enemy.x + enemy.width > ship.x &&
enemy.y < ship.y + ship.height &&
enemy.y + enemy.height > ship.y) {
gameRunning = false;
alert("Game Over! Sua pontuação: " + score);
document.location.reload();
}
});
// Checa colisão dos tiros com os inimigos
ship.bullets.forEach((bullet, bIndex) => {
enemies.forEach((enemy, eIndex) => {
if (bullet.x < enemy.x + enemy.width &&
bullet.x + bullet.width > enemy.x &&
bullet.y < enemy.y + enemy.height &&
bullet.y + bullet.height > enemy.y) {
enemies.splice(eIndex, 1);
ship.bullets.splice(bIndex, 1);
score += 10;
}
});
});
}
function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
// Desenha a nave
ctx.fillStyle = "blue";
ctx.fillRect(ship.x, ship.y, ship.width, ship.height);
// Desenha os tiros
ctx.fillStyle = "yellow";
ship.bullets.forEach((bullet) => {
ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
});
// Desenha os inimigos
ctx.fillStyle = "red";
enemies.forEach((enemy) => {
ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
});
// Exibe a pontuação
ctx.fillStyle = "white";
ctx.font = "20px Arial";
ctx.fillText("Pontuação: " + score, 10, 30);
}
function gameLoop() {
update();
draw();
if (gameRunning) requestAnimationFrame(gameLoop);
}
// Inicia o jogo
setInterval(spawnEnemy, 2000);
gameLoop();
</script>
</body>
</html>
